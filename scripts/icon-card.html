<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #1c1612; }
    body { font-family: "WenQuanYi Micro Hei", serif; }
    .seal {
      width: 512px; height: 512px; display: grid; place-items: center;
      background:
        radial-gradient(circle at 50% 46%, rgba(212, 83, 58, 0.35), transparent 46%),
        #1c1612;
    }
    .ring {
      width: 390px; height: 390px; border-radius: 50%;
      border: 16px solid #d4533a;
      box-shadow: inset 0 0 0 10px rgba(231, 177, 90, 0.7);
      display: grid; place-items: center;
      color: #f4efe6; font-size: 210px; line-height: 1;
    }
  </style>
</head>
<body>
  <div class="seal"><div class="ring">驿</div></div>
</body>
</html>
