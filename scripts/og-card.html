<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: "WenQuanYi Micro Hei", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(212, 83, 58, 0.45), transparent 28%),
        radial-gradient(circle at 90% 80%, rgba(231, 177, 90, 0.28), transparent 26%),
        #14110e;
      color: #f6f1e8;
    }
    .card { box-sizing: border-box; height: 630px; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
    .seal {
      width: 92px; height: 92px; border-radius: 50%;
      border: 4px solid #d4533a; box-shadow: inset 0 0 0 5px rgba(231, 177, 90, 0.45);
      display: grid; place-items: center; font-size: 42px;
    }
    .eyebrow { letter-spacing: 0.22em; color: #e7b15a; font-size: 22px; margin: 28px 0 12px; }
    h1 { font-size: 92px; line-height: 1; margin: 0; }
    p { font-size: 32px; line-height: 1.45; max-width: 860px; color: #cfc0ae; margin: 18px 0 0; }
    .url { font-size: 24px; color: #f3d7a6; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <div class="seal">驿</div>
      <div class="eyebrow">THE POST HOUSE · SHENZHEN</div>
      <h1>嵌入式驿站</h1>
      <p>深圳硬件人的夜班柜台。每天一题，工具不用安装，华强北的价格不编。</p>
    </div>
    <div class="url">renhil.github.io/The-Post-House-of-Embedded-Systems-Engineers</div>
  </div>
</body>
</html>
